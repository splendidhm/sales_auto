[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affiliate-hub"
version = "0.2.0"
description = "Offline-first affiliate content preparation for Windows"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit==1.65.0"]
dev = ["pytest>=8,<10"]

[project.scripts]
affiliate-hub = "affiliate_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
